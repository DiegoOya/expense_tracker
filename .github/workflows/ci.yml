name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Format
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Types
        run: .venv/bin/mypy

      - name: Tests
        run: .venv/bin/pytest

      - name: Specs
        run: .venv/bin/python scripts/check_specs.py

  # The gitleaks CLI, not gitleaks-action: on a push the action scans
  # only "<first pushed commit>^..<last>", which breaks on a root
  # commit and then reports "no leaks" after scanning 0 bytes.
  # `gitleaks git .` always scans the full history.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/${checksums}"
          sha256sum --ignore-missing -c "${checksums}"
          tar -xzf "${tarball}" gitleaks

      - name: Scan full history
        run: ./gitleaks git . --redact --verbose
